# 번들 cowrie.cfg.dist 위에 덮어쓰는 값만 적는다. 나머지는 기본값
# 두 센서가 이 파일을 똑같이 써야 리전 비교가 성립함

[honeypot]
# 기본값 svr04 는 허니팟 지문으로 알려져 있음
hostname = srv-web-01
timezone = UTC

[ssh]
enabled = true
# 실제 Ubuntu 26.04 openssh-server(1:10.2p1-2ubuntu3.6) 배너 형식.
# 서버가 생기면 nc -w1 127.0.0.1 62222 로 실제 배너를 떠서 교체할 것
version = SSH-2.0-OpenSSH_10.2p1 Ubuntu-2ubuntu3.6
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
# 기본값 false. 나중에 켜면 SSH 와 관측 기간이 달라져 비교축이 깨진다
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false
